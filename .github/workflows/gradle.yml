name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

    - name: Build plugin
      run: ./gradlew buildPlugin

    - name: Verify plugin package
      run: |
        echo "=== Plugin package info ==="
        ls -lh build/distributions/*.zip
        echo "=== Verify zip contents ==="
        unzip -l build/distributions/*.zip

    - name: Extract plugin version
      if: github.event_name == 'push'
      id: version
      run: echo "version=$(grep 'version = ' build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')" >> $GITHUB_OUTPUT

    - name: Create release tag
      if: github.event_name == 'push'
      id: tag
      uses: actions/github-script@v7
      with:
        script: |
          const version = '${{ steps.version.outputs.version }}';
          const tagName = `v${version}`;
          const sha = context.sha;
          try {
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${tagName}`,
              sha: sha
            });
            console.log(`Created tag ${tagName}`);
            core.setOutput('created', 'true');
          } catch (e) {
            if (e.status === 422) {
              console.log(`Tag ${tagName} already exists, skipping`);
              core.setOutput('created', 'false');
            } else {
              throw e;
            }
          }

    - name: Publish plugin to JetBrains Marketplace
      if: github.event_name == 'push' && steps.tag.outputs.created == 'true'
      env:
        PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
        PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
      run: ./gradlew publishPlugin --no-configuration-cache

  dependency-submission:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Generate and submit dependency graph
      uses: gradle/actions/dependency-submission@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
